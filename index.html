</div><script>const values=['Erfolg','Integrität','Ordnung','Veränderung','Leistung','Mut','Einfluss','Macht','Status','Fortschritt','Freundschaft','Gelassenheit','Team','Verantwortung','Respekt','Selbstbestimmung','Familie','Achtsamkeit','Gerechtigkeit','Neugier','Dankbarkeit','Disziplin','Sicherheit','Vertrauen','Freude','Sinn','Harmonie','Loyalität','Freiheit','Liebe','Authentizität','Verlässlichkeit','Empathie'];let current=[],survivors=[],idx=0,round=1,joker=2,selected=[];function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}function startGame(){current=shuffle([...values]);survivors=[];idx=0;round=1;joker=2;document.getElementById('result').style.display='none';document.getElementById('game').style.display='block';showPair();}function ui(){status.innerText='Runde '+round;const verarbeitet=Math.floor(idx/2)*2; const prognose=survivors.length + Math.max(0,current.length-verarbeitet); document.getElementById('countBadge').innerText=prognose+' Werte im Rennen';jokerEl=document.getElementById('joker');jokerEl.innerText='Joker übrig: '+joker;const b=document.getElementById('bothBtn');if(current.length<=10){b.style.display='none';jokerEl.innerText='Finale Priorisierung';}else{b.style.display='inline-block';b.disabled=joker<1;}}function showPair(){selected=[];if(current.length<=5){finish();return;}if(idx>=current.length){current=shuffle([...survivors]);survivors=[];idx=0;round++;if(current.length<=5){finish();return;}}if(!current[idx+1]){survivors.push(current[idx]);idx++;showPair();return;}leftCard.textContent=current[idx];rightCard.textContent=current[idx+1];leftCard.classList.remove('selected');rightCard.classList.remove('selected');ui();}function toggleSelect(n){if(current.length<=10){selected=[n];leftCard.classList.toggle('selected',n===0);rightCard.classList.toggle('selected',n===1);}else{selected=[n];leftCard.classList.toggle('selected',n===0);rightCard.classList.toggle('selected',n===1);}}function weiter(){if(selected.includes(0))survivors.push(current[idx]);if(selected.includes(1))survivors.push(current[idx+1]);idx+=2;showPair();}function beide(){if(joker<1)return;joker--;survivors.push(current[idx],current[idx+1]);idx+=2;showPair();}
function finish(){
document.getElementById('game').style.display = 'none';
document.getElementById('result').style.display = 'block';
const topValues = current.slice(0,5);
top5.innerHTML = topValues
.map(v => '<div class="pill">' + v + '</div>')
.join('');
const qrContainer = document.getElementById('qrcode');
qrContainer.innerHTML = '';
const payload = {
datum: new Date().toLocaleDateString('de-DE'),
werte: topValues
};
new QRCode(qrContainer, {
text: JSON.stringify(payload, null, 2),
width: 220,
height: 220,
colorDark: "#0f4c9a",
colorLight: "#ffffff",
correctLevel: QRCode.CorrectLevel.H
});
}
startGame();</script></body></html>
